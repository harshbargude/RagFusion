version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ragapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ragapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_UPLOAD_PATH: /uploads
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      - db
    volumes:
      - uploads:/uploads
    restart: unless-stopped

volumes:
  db_data:
  uploads:

# Use `docker-compose up --build` to start the stack for local production testing.