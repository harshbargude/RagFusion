spring.application.name=ragapp

# Database (externalize via env vars / secret manager)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000

# JPA: in production prefer `validate` so schema changes are explicit
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT (must be provided via env/secret store)
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

# File upload
app.upload.max-size=50MB
app.upload.allowed-types=csv,xlsx,txt,pdf,docx
app.upload.path=${APP_UPLOAD_PATH:/var/lib/ragapp/uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Management/Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Logging
logging.level.root=INFO
logging.level.com.example.ragapp=INFO
logging.file.path=${LOG_PATH:/var/log/ragapp}

# Gemini/Google API (externalize)
google.api.key=${GOOGLE_API_KEY:}
google.gemini.model=${GOOGLE_GEMINI_MODEL:gemini-2.5-flash}
app.ai.max-prompt-length=${APP_AI_MAX_PROMPT_LENGTH:10000}
app.ai.rate-limit.requests-per-minute=${APP_AI_RATE_LIMIT:60}

# ==========================